name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@latest

      - name: Build umwi library
        run: alr -n build

      - name: Build and run demo self-checks
        working-directory: demo
        run: |
          alr -n build
          ./bin/demo

      - name: Build and run clusters_demo self-checks
        working-directory: clusters_demo
        run: |
          alr -n build
          ./bin/clusters_demo
